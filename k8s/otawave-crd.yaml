apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: otawaves.ota.research
spec:
  group: ota.research
  scope: Namespaced
  names:
    plural: otawaves
    singular: otawave
    kind: OTAWave
    shortNames:
      - ow
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Action
          type: string
          jsonPath: .spec.action
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Step
          type: integer
          jsonPath: .status.currentStep
        - name: Message
          type: string
          jsonPath: .status.message
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [action, order]
              properties:
                action:
                  type: string
                  enum: [activate, deactivate]
                  description: "activate or deactivate the wave"
                order:
                  type: array
                  items:
                    type: string
                  description: "ordered list of services to transition"
                drainSeconds:
                  type: integer
                  default: 10
                  description: "seconds to drain traffic before pod removal"
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: "Pending | Running | Completed | Failed"
                currentStep:
                  type: integer
                message:
                  type: string
                lastUpdated:
                  type: string
