apiVersion: v1
kind: ConfigMap
metadata:
  name: ota-app
  namespace: ota-pipeline
data:
  app.py: |
    #!/usr/bin/env python3
    """
    Minimal OTA pipeline dummy service.
    Uses only Python stdlib — no pip install required.

    Endpoints:
      GET /health       -> 200 "ok"  (liveness / readiness probe)
      GET /call         -> calls NEXT_SERVICE chain, returns JSON
      GET /info         -> returns service name and env
    """
    import http.server
    import json
    import os
    import urllib.request
    import urllib.error

    SERVICE_NAME = os.getenv("SERVICE_NAME", "unknown")
    NEXT_SERVICE = os.getenv("NEXT_SERVICE", "")   # e.g. "campaign:8080"
    PORT = int(os.getenv("PORT", "8080"))


    class Handler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/health":
                self._respond(200, b"ok", "text/plain")

            elif self.path == "/info":
                body = json.dumps({
                    "service": SERVICE_NAME,
                    "next_service": NEXT_SERVICE,
                    "port": PORT,
                }).encode()
                self._respond(200, body, "application/json")

            elif self.path == "/call":
                result = {"service": SERVICE_NAME, "status": "ok"}
                if NEXT_SERVICE:
                    try:
                        resp = urllib.request.urlopen(
                            f"http://{NEXT_SERVICE}/call", timeout=5
                        )
                        result["next"] = json.loads(resp.read().decode())
                    except urllib.error.URLError as e:
                        result["next_error"] = str(e.reason)
                    except Exception as e:
                        result["next_error"] = str(e)
                self._respond(200, json.dumps(result).encode(), "application/json")

            else:
                self._respond(404, b"not found", "text/plain")

        def _respond(self, code, body, content_type):
            self.send_response(code)
            self.send_header("Content-Type", content_type)
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, fmt, *args):  # suppress per-request stdout noise
            pass


    if __name__ == "__main__":
        print(f"[{SERVICE_NAME}] listening on :{PORT}  next={NEXT_SERVICE or 'none'}")
        http.server.HTTPServer(("", PORT), Handler).serve_forever()
